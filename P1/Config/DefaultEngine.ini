; 서버 틱레이트를 60Hz로 올렸으므로(아래 IpNetDriver 섹션) 클라이언트 이동 전송 주기도 엔진
; 기본값(0.0166=1/60)으로 맞춘다 — 서버가 60Hz로 처리하니 그에 맞춰 보내야 낭비가 없다.
; 참고: 이 ini만으론 CDO에 안 먹혀서(원인 미상, 재현됨) P1PlayerController::BeginPlay()에
; GetMutableDefault<AGameNetworkManager>()로 직접 강제하는 코드 폴백을 병행 중 — 그쪽 값도 같이 맞출 것.
; GlobalConfig 프로퍼티라 에디터가 이미 켜진 상태에선 이 ini 변경이 그 세션에 반영 안 됨(재시작 필요).
[/Script/Engine.GameNetworkManager]
ClientNetSendMoveDeltaTime=0.0166
ClientNetSendMoveDeltaTimeThrottled=0.0166
ClientNetSendMoveDeltaTimeStationary=0.0166

; 2코어(물리 1코어)+60Hz로 목표를 상향 — 4코어/30Hz는 스파이크 없이 완전히 안정적이었음
; (2026-08-29~30 측정), 그래서 이 조합을 새 실전 목표로 채택.
[/Script/OnlineSubsystemUtils.IpNetDriver]
