; 기본값 false — UE는 기본적으로 내비게이션 시스템을 서버(권위)에서만 생성하고 클라이언트엔 아예 안 만든다.
; 이 프로젝트의 부하테스트 봇은 (정글몹 AI와 달리) 자기 자신의 클라이언트에서 직접 경로탐색을
; 하므로(UP1BotArenaComponent, APlayerController가 조종해 AAIController::MoveToLocation을 못 쓰는 대신
; UNavigationSystemV1::FindPathToLocationSynchronously를 직접 호출) 클라이언트에도 내비메시 데이터가
; 로드돼 있어야 한다 — 이게 꺼져 있으면 FindPathToLocationSynchronously가 항상 null을 반환한다
; (실제로 겪은 버그, 재시도 155회 이상 해도 계속 null이라 타이밍 문제가 아니라 정책임을 확인했음).
