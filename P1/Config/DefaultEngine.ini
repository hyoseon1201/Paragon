[/Script/Engine.Engine]
+ActiveGameNameRedirects=(OldGameName="TP_Blank",NewGameName="/Script/P1")
+ActiveGameNameRedirects=(OldGameName="/Script/TP_Blank",NewGameName="/Script/P1")

; 엔진 기본값(0.0166=60Hz)이 서버 NetServerMaxTickRate=30Hz보다 높아서, 클라이언트가 서버가 어차피
; 처리 못 할 빈도로 이동 정보를 보내고 있었다(baseline Insights 실측 — ServerMovePacked Excl 1위,
; ~14%) — 서버 틱레이트에 맞춰 0.0333(1/30)으로 하향. GlobalConfig라 이 섹션에서만 조정하면 된다.
; 참고: GlobalConfig 프로퍼티는 클래스 CDO 생성 시점에 한 번 읽히므로, 에디터가 이미 켜져 있는
; 상태에서 이 값을 바꿔도 그 세션에는 반영 안 됨 — 에디터/PIE를 재시작해야 확인 가능하다.
